name: Test & Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Frontend unit / component tests (Vitest + RTL) ────────────────────────
  frontend-unit:
    name: Frontend Unit (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/aminra-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/aminra-web/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/aminra-web/coverage/
          retention-days: 7

  # ── Backend tests + coverage (pytest) ─────────────────────────────────────
  # Uses docker compose so tests hit the real Postgres + Qdrant,
  # matching the integration-first philosophy in CLAUDE.md.
  backend-tests:
    name: Backend Tests (pytest + cov)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-test-password
      QDRANT_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4

      - name: Create external Docker resources
        run: |
          docker network create vault-network || true
          docker volume create vault-secrets || true

      - name: Build & start stack
        run: |
          docker compose -f docker-compose.yml build aminra-backend
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 180 aminra-backend

      - name: Install test deps in backend container
        run: |
          docker exec aminra-docker-system-aminra-backend-1 \
            pip install pytest pytest-asyncio pytest-cov httpx respx pytest-mock

      - name: Copy tests into container
        run: |
          docker cp backend/tests      aminra-docker-system-aminra-backend-1:/app/tests
          docker cp backend/pytest.ini aminra-docker-system-aminra-backend-1:/app/pytest.ini

      - name: Run pytest with coverage (fail if < 80%)
        run: |
          docker exec aminra-docker-system-aminra-backend-1 \
            pytest tests/ \
              --cov=. \
              --cov-report=term-missing \
              --cov-report=xml:/app/coverage.xml \
              --cov-fail-under=80

      - name: Extract coverage report
        if: always()
        run: |
          docker cp aminra-docker-system-aminra-backend-1:/app/coverage.xml backend-coverage.xml || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage.xml
          retention-days: 7

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100 aminra-backend

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ── Playwright E2E (full stack) ───────────────────────────────────────────
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-unit]
    env:
      POSTGRES_PASSWORD: ci-test-password
      QDRANT_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/aminra-web/package-lock.json

      - name: Create external Docker resources
        run: |
          docker network create vault-network || true
          docker volume create vault-secrets || true

      - name: Build & start full stack
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 240

      - name: Install frontend deps + Playwright browsers
        working-directory: frontend/aminra-web
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend/aminra-web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          BACKEND_BASE_URL: http://localhost:8100
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/aminra-web/playwright-report/
          retention-days: 7

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Teardown
        if: always()
        run: docker compose down -v
