name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/aminra-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/aminra-web/package-lock.json
      - run: npm ci
      - run: npm run lint

  build-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    env:
      POSTGRES_PASSWORD: ci-test-password
      QDRANT_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4

      - name: Create external Docker resources
        run: |
          docker network create vault-network || true
          docker volume create vault-secrets || true

      - name: Build & start
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 180

      - name: Health checks
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/health && break
            [ "$i" = "30" ] && { docker compose logs aminra-backend; exit 1; }
            sleep 5
          done
          curl -sf http://localhost:3100 > /dev/null

      - name: Smoke tests
        run: |
          curl -sf http://localhost:8100/health
          curl -sf http://localhost:8100/stats

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=80

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml down -v
