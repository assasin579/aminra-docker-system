services:
  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: aminra-prometheus
    ports:
      - "9090:9090"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus-data:/prometheus
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network
    restart: unless-stopped

  # ── Docker stats exporter ────────────────────────────────────────────────────
  # Replaces cAdvisor for this host. Docker 28+ `overlayfs` storage driver
  # breaks cAdvisor's layerdb lookup → no `name=` label → cannot filter alerts
  # by container name. This is a ~60-line Python exporter that talks straight
  # to the Docker socket and exposes per-container memory metrics on :9417.
  # Added 2026-05-14 (U18). Re-evaluate when cAdvisor upstream fixes
  # https://github.com/google/cadvisor/issues — overlayfs driver support.
  docker-stats-exporter:
    build:
      context: ./docker-stats-exporter
      dockerfile: Dockerfile
    image: aminra/docker-stats-exporter:local
    container_name: aminra-docker-stats-exporter
    ports:
      - "127.0.0.1:9417:9417"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - POLL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - monitoring-network
    restart: unless-stopped

  # ── Loki ─────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: aminra-loki
    # Port 3100 internal only (conflicts with aminra-frontend on host)
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - monitoring-network
    restart: unless-stopped

  # ── Promtail ─────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: aminra-promtail
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    depends_on:
      - loki

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: aminra-grafana
    ports:
      - "3200:3000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

networks:
  monitoring-network:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
