global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting_rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aminra-backend'
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:8100']

  - job_name: 'qdrant'
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:6433']

  # Docker stats exporter — per-container memory (replaces cAdvisor on this host
  # because Docker 28+ overlayfs storage driver breaks cAdvisor metadata lookup).
  - job_name: 'docker-stats'
    scrape_interval: 30s
    static_configs:
      - targets: ['docker-stats-exporter:9417']
