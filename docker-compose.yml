services:
  # ── Nginx (production only) ───────────────────────────────────────────────
  # Start with: docker compose --profile production up -d
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      aminra-backend:
        condition: service_healthy
      aminra-frontend:
        condition: service_healthy
    profiles:
      - production

  aminra-frontend:
    build:
      context: ./frontend/aminra-web
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://aminra-backend:8000
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      aminra-backend:
        condition: service_healthy

  # Dev mode frontend — hot reload, no rebuild needed
  # Start with: docker compose up -d aminra-frontend-dev
  aminra-frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://aminra-backend:8000
    volumes:
      - ./frontend/aminra-web:/app
      - /app/node_modules
    tmpfs:
      - /app/.next:exec
    networks:
      - app-network
    depends_on:
      aminra-backend:
        condition: service_healthy
    profiles:
      - dev

  aminra-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8100:8000"
    environment:
      - QDRANT_URL=http://qdrant-db:6333
      - REDIS_URL=redis://redis:6379/0
      - EMBED_MODEL=intfloat/multilingual-e5-base
      # Server tuning — see backend/env.example for full reference
      - WEB_CONCURRENCY=4
      - WORKER_TIMEOUT=240
      - MAX_REQUESTS=1000
      - MAX_REQUESTS_JITTER=100
      - DB_POOL_MIN_SIZE=2
      - DB_POOL_MAX_SIZE=15
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_HOURS=8
      - JWT_REFRESH_DAYS=7
      # Web Push (PWA) — generated 2026-04-26; rotate via Vault for production
      - VAPID_PUBLIC_KEY=BEXej9buEL1puCJ8OUf7XSn2PE8r0t-wAmH8MZdme8Rxk0RuZG9ZPUdRURm8yxRhRE40VDBV_aOEhryz-FzZKjQ
      - VAPID_PRIVATE_KEY=ISueXo3ZfreT0TRVqani5T5IzPg8AyMPMpXHSQ7pJA0
      - VAPID_CONTACT_EMAIL=mailto:support@aminra.vn
      - CORS_ORIGINS=https://dev-web.silvergem.org,https://fe.silvergem.org,https://mukjizat.silvergem.org,http://localhost:3000,http://localhost:3001
      - FRONTEND_URL=https://dev-web.silvergem.org
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENVIRONMENT=production
      # Secrets are injected via /vault/secrets/env.sh (see entrypoint.sh)
    networks:
      - app-network
      - vault-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - upload-data:/app/docs
      - review-data:/app/reviews
      - template-data:/app/admin_templates
      - doc-cache:/app/doc_text_cache
      - vault-secrets:/vault/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      qdrant-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  postgres-db:
    build:
      context: ./databases/postgres
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DB=aminra
      - POSTGRES_USER=aminra_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aminra_user -d aminra"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant-db:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6433:6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "services.jobs.WorkerSettings"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant-db:6333
      - EMBED_MODEL=intfloat/multilingual-e5-base
    volumes:
      - upload-data:/app/docs
    networks:
      - app-network
      - vault-network
    depends_on:
      redis:
        condition: service_healthy
      aminra-backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G

networks:
  app-network:
    driver: bridge
  vault-network:
    external: true

volumes:
  qdrant-data:
  postgres-data:
  upload-data:
  review-data:
  redis-data:
  template-data:
  doc-cache:
  vault-secrets:
    external: true
