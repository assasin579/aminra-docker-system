services:
  # ── Nginx (production only) ───────────────────────────────────────────────
  # Start with: docker compose --profile production up -d
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      aminra-backend:
        condition: service_healthy
      aminra-frontend:
        condition: service_healthy
    profiles:
      - production

  aminra-frontend:
    build:
      context: ./frontend/aminra-web
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - NODE_ENV=production
      - BACKEND_URL=http://aminra-backend:8000
      # ADR-005 Phase 2 Keycloak SSO — flag off until canary verified
      - NEXT_PUBLIC_AUTH_KEYCLOAK_ENABLED=${NEXT_PUBLIC_AUTH_KEYCLOAK_ENABLED:-false}
      - NEXT_PUBLIC_KEYCLOAK_URL=${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
      - NEXT_PUBLIC_KEYCLOAK_REALM=aminra
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=aminra-frontend
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      aminra-backend:
        condition: service_healthy

  # Dev mode frontend — hot reload, no rebuild needed
  # Start with: docker compose up -d aminra-frontend-dev
  aminra-frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache tzdata && npm install --legacy-peer-deps && npm run dev"
    ports:
      - "3100:3000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - NODE_ENV=development
      - BACKEND_URL=http://aminra-backend:8000
      # ADR-005 Phase 2 Keycloak SSO — flag off in dev unless explicitly toggled
      - NEXT_PUBLIC_AUTH_KEYCLOAK_ENABLED=${NEXT_PUBLIC_AUTH_KEYCLOAK_ENABLED:-false}
      - NEXT_PUBLIC_KEYCLOAK_URL=${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8180}
      - NEXT_PUBLIC_KEYCLOAK_REALM=aminra
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=aminra-frontend
    volumes:
      - ./frontend/aminra-web:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    tmpfs:
      - /app/.next:exec
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2.5G
        reservations:
          memory: 1G
    depends_on:
      aminra-backend:
        condition: service_healthy
    profiles:
      - dev

  aminra-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8100:8000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - QDRANT_URL=http://qdrant-db:6333
      - REDIS_URL=redis://redis:6379/0
      - EMBED_MODEL=intfloat/multilingual-e5-base
      # Server tuning — see backend/env.example for full reference
      - WEB_CONCURRENCY=4
      - WORKER_TIMEOUT=240
      - MAX_REQUESTS=1000
      - MAX_REQUESTS_JITTER=100
      - DB_POOL_MIN_SIZE=2
      - DB_POOL_MAX_SIZE=15
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_HOURS=8
      - JWT_REFRESH_DAYS=7
      # ADR-005 Phase 3a dual-auth — flag off until FE migration complete
      - AUTH_KEYCLOAK_ENABLED=${AUTH_KEYCLOAK_ENABLED:-false}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8180}
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_REALM=aminra
      - KEYCLOAK_AUDIENCE=aminra-backend
      # Phase 4 admin REST — service account for user creation
      - KEYCLOAK_ADMIN_CLI_CLIENT_ID=aminra-admin-cli
      - KEYCLOAK_ADMIN_CLI_SECRET=${KEYCLOAK_ADMIN_CLI_SECRET:-}
      # Web Push (PWA) — VAPID keys sourced from Vault (secret/aminra/web-push)
      # Rotation: bash vault/scripts/rotate-secrets.sh web-push
      - CORS_ORIGINS=https://dev-web.silvergem.org,https://fe.silvergem.org,https://mukjizat.silvergem.org,http://localhost:3000,http://localhost:3001
      - FRONTEND_URL=https://dev-web.silvergem.org
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENVIRONMENT=production
      # Secrets are injected via /vault/secrets/env.sh (see entrypoint.sh)
    networks:
      - app-network
      - vault-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - upload-data:/app/docs
      - review-data:/app/reviews
      - template-data:/app/admin_templates
      - doc-cache:/app/doc_text_cache
      - vault-secrets:/vault/secrets:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      qdrant-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  postgres-db:
    build:
      context: ./databases/postgres
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PGTZ=Asia/Ho_Chi_Minh
      - POSTGRES_DB=aminra
      - POSTGRES_USER=aminra_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Keycloak DB bootstrap — used by 02-keycloak-init.sh (ADR-005 Phase 1)
      - KEYCLOAK_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aminra_user -d aminra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak (auth provider — ADR-005) ────────────────────────────────────
  # Realm bootstrap qua scripts/keycloak-bootstrap.sh (idempotent, kc.sh CLI).
  # Phase 4c-10 (2026-05-14): switched from upstream image + `start-dev` to a
  # locally-built production image running `start --optimized`. Build-time
  # config (KC_DB, KC_HEALTH_ENABLED, KC_METRICS_ENABLED, KC_HTTP_ENABLED) is
  # baked into the image — see keycloak/Dockerfile. Runtime env below supplies
  # URL/passwords/hostname only.
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - KC_DB_URL=jdbc:postgresql://postgres-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME_STRICT=true
      - KC_HOSTNAME_STRICT_BACKCHANNEL=false
      - KC_LOG_LEVEL=INFO
      # Production hostname (Cloudflare Tunnel → localhost:8180, set 2026-05-14 Phase A)
      - KC_HOSTNAME=auth.silvergem.org
      - KC_PROXY=edge
    ports:
      - "8180:8080"
      - "127.0.0.1:9180:9000"   # Management port — localhost only (metrics, health, JVM stats)
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-themes/aminra:/opt/keycloak/themes/aminra:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - app-network
      - vault-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      postgres-db:
        condition: service_healthy

  qdrant-db:
    build:
      context: ./databases/qdrant
    ports:
      - "6433:6333"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "services.jobs.WorkerSettings"]
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant-db:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - EMBED_MODEL=intfloat/multilingual-e5-base
    volumes:
      - upload-data:/app/docs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - app-network
      - vault-network
    depends_on:
      redis:
        condition: service_healthy
      aminra-backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G

networks:
  app-network:
    driver: bridge
  vault-network:
    external: true

volumes:
  qdrant-data:
  postgres-data:
  upload-data:
  review-data:
  redis-data:
  template-data:
  doc-cache:
  keycloak-data:
  vault-secrets:
    external: true
