services:
  # ── Nginx (production only) ───────────────────────────────────────────────
  # Start with: docker compose --profile production up -d
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      aminra-backend:
        condition: service_healthy
      aminra-frontend:
        condition: service_healthy
    profiles:
      - production

  aminra-frontend:
    build:
      context: ./frontend/aminra-web
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://aminra-backend:8000
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      aminra-backend:
        condition: service_healthy

  aminra-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8100:8000"
    environment:
      - QDRANT_URL=http://qdrant-db:6333
      - EMBED_MODEL=intfloat/multilingual-e5-base
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_HOURS=8
      - JWT_REFRESH_DAYS=7
      - CORS_ORIGINS=https://fe.silvergem.org,https://mukjizat.silvergem.org,http://localhost:3000,http://localhost:3001
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENVIRONMENT=production
      # Secrets are injected via /vault/secrets/env.sh (see entrypoint.sh)
    networks:
      - app-network
      - vault-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - upload-data:/app/docs
      - review-data:/app/reviews
      - template-data:/app/admin_templates
      - doc-cache:/app/doc_text_cache
      - vault-secrets:/vault/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      qdrant-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  postgres-db:
    build:
      context: ./databases/postgres
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DB=aminra
      - POSTGRES_USER=aminra_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aminra_user -d aminra"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant-db:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6433:6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge
  vault-network:
    external: true

volumes:
  qdrant-data:
  postgres-data:
  upload-data:
  review-data:
  template-data:
  doc-cache:
  vault-secrets:
    external: true
