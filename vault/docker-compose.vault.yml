# ── Vault Stack (independent of main application stack) ────────────────────────
# Start:  docker compose -f vault/docker-compose.vault.yml up -d
# Init:   bash vault/scripts/init-vault.sh
# UI:     http://localhost:8200/ui

services:
  vault-server:
    image: hashicorp/vault:1.17
    container_name: vault-server
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://vault-server:8200
    volumes:
      - vault-data:/vault/data
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - vault-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 2>&1 | grep -q 'Sealed.*false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  vault-agent:
    image: hashicorp/vault:1.17
    container_name: vault-agent
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - VAULT_ADDR=http://vault-server:8200
    volumes:
      - ./config/agent.hcl:/vault/config/agent.hcl:ro
      - ./templates/env.tpl:/vault/templates/env.tpl:ro
      - ./approle:/vault/approle:ro
      - vault-secrets:/vault/secrets
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    entrypoint: vault
    command: agent -config=/vault/config/agent.hcl
    networks:
      - vault-network
    restart: unless-stopped
    depends_on:
      vault-server:
        condition: service_healthy

networks:
  vault-network:
    name: vault-network
    driver: bridge

volumes:
  vault-data:
    name: vault-data
  vault-secrets:
    name: vault-secrets
