[pytest]
# AMINRA backend test config
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support — auto-detect async functions, no need to mark each
asyncio_mode = auto

# Output verbosity + failure info
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -p no:warnings

# Custom markers — use @pytest.mark.<name>
markers =
    unit: pure unit tests (no DB, no HTTP)
    integration: hits real DB / Qdrant / HTTP
    slow: >5s, skip in fast CI runs
    rag: touches RAG pipeline (may hit LLM — mock via respx)

# Coverage defaults — add --cov when you want coverage
# Example: pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=80
