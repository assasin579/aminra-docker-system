# Ruff linter configuration for AMINRA backend
line-length = 120
target-version = "py311"

extend-exclude = ["tests", "alembic"]

[lint]
select = ["E", "F", "W"]
# Soft-ignored as of 2026-04-29 (Phase 0 baseline). Promote to errors after
# pre-existing violations cleaned up. Tracked in backlog.
ignore = [
  "E501",  # line too long (covered by formatter)
  "E402",  # module-level import not at top of file (24 sites — lazy/conditional imports)
  "E722",  # bare except (6 sites — defensive paths, want explicit narrowing later)
  "E741",  # ambiguous variable names (4 sites — `l` in iterator code, low priority)
  "F841",  # unused local variable (7 sites — debugging stubs to clean up)
  "F821",  # undefined name (4 sites — real bugs at:
           #   - auth/audit_router.py:1462 (log_audit not imported)
           #   - auth/submission_router.py:1095 (author_name unbound)
           #   - auth/submission_router.py:1096 (req unbound)
           #   - services/anchor.py:39 (forward-ref in type annotation, benign)
           # Fix as part of next backend hardening sprint.)
]
