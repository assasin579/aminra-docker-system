<!DOCTYPE html>
<html lang="{{ lang|default('vi') }}">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <!--
    CSP: render-time. Chromium emits PDF bytes from this DOM; CSP blocks
    accidental external load if a designer pastes `src="https://..."`
    into a template. See threat-model.md §R1, R2, R3.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none';">
  <link rel="stylesheet" href="{{ asset('_base/base.css') }}">
  <link rel="stylesheet" href="{{ asset('_base/print.css') }}" media="all">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% if is_draft %}is-draft{% endif %}">
  {% block content %}{% endblock %}
</body>
</html>
