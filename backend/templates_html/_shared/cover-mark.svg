<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="presentation">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="g2" x1="1" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Mid ring with dashed -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- Halal-leaf abstract — overlapping rotated shapes -->
  <g transform="translate(100 100)">
    <ellipse cx="0" cy="0" rx="52" ry="22" transform="rotate(-30)" fill="url(#g1)"/>
    <ellipse cx="0" cy="0" rx="52" ry="22" transform="rotate(30)"  fill="url(#g2)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.92"/>
    <text x="0" y="3" text-anchor="middle"
          font-family="Inter, sans-serif" font-weight="900" font-size="11"
          fill="#0a1f44" letter-spacing="0.5">A</text>
  </g>
</svg>
