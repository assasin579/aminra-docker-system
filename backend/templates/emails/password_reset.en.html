<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 24px; color: #1f2937;">
  <h2 style="color: #059669;">Reset your AMINRA password</h2>
  <p>Hello {{ user_name | default("there") }},</p>
  <p>You requested a password reset for your AMINRA account.</p>
  <p>
    <a href="{{ reset_url }}"
       style="display:inline-block;padding:12px 24px;background:#059669;color:#fff;text-decoration:none;border-radius:6px;font-weight:600;">
      Reset password
    </a>
  </p>
  <p style="font-size: 13px; color: #6b7280;">
    The link expires in {{ ttl_minutes | default(60) }} minutes. If you didn't request this, you can safely ignore this email.
  </p>
  <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">
  <p style="font-size: 12px; color: #9ca3af;">— The {{ from_name }} team</p>
</body>
</html>
